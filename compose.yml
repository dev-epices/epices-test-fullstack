networks:
  epices_shared:
    external: true
  caddy_network:
    external: true

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    command: bin/dev -b 0.0.0.0 -p 3000
    expose:
      - 3000
    networks:
      - epices_shared
      - caddy_network

    volumes:
      - .:/app
      - bundler:/usr/local/bundle

    # ports:
    #   - "3100:3000"

volumes:
  bundler:

